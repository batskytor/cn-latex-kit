[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cn-latex-kit"
version = "1.0.0"
description = "Convert Word thesis templates to LaTeX and smart-compile Chinese LaTeX documents with XeLaTeX."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "cn-latex-kit contributors" }]
keywords = ["latex", "xelatex", "chinese", "thesis", "word", "template", "ctex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = ["python-docx>=1.1.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
cnlatex = "cn_latex_kit.cli:main"

[tool.setuptools]
packages = ["cn_latex_kit", "cn_latex_kit.word", "cn_latex_kit.latex", "cn_latex_kit.build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
